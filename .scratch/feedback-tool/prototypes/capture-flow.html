<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PROTOTYPE — capture flow (3 variants)</title>
<!-- Three variants of "log feedback → extract issue", switchable via ?variant=A|B|C and the bottom bar. Throwaway. -->
<style>
  :root { --ink:#1c1b19; --mut:#7a766e; --line:#e2ded6; --bg:#faf8f4; --card:#fff; --acc:#b5461d; --ok:#2e7d4f; --warn:#c98a12; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 -apple-system, "Inter", system-ui, sans-serif; color:var(--ink); background:var(--bg); padding-bottom:90px; }
  header { padding:14px 24px; border-bottom:1px solid var(--line); background:var(--card); display:flex; gap:18px; align-items:baseline; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .meta { color:var(--mut); font-size:13px; }
  .meters { margin-left:auto; display:flex; gap:14px; font-size:13px; }
  .meters b { font-variant-numeric:tabular-nums; }
  .badge { background:var(--warn); color:#fff; border-radius:10px; padding:0 7px; font-size:12px; }
  main { padding:20px 24px; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--card); border-radius:6px; padding:4px 10px; color:var(--ink); }
  button.pri { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.sm { font-size:12px; padding:2px 8px; }
  input, textarea, select { font:inherit; border:1px solid var(--line); border-radius:6px; padding:6px 8px; width:100%; background:#fff; color:var(--ink); }
  textarea { resize:vertical; min-height:64px; }
  .pill { display:inline-block; border-radius:999px; padding:1px 8px; font-size:12px; background:#eee9df; color:#5a554b; }
  .pill.s { background:#e3eef8; color:#2b5a86; }
  .tag { font-size:11px; color:var(--mut); }
  .mut { color:var(--mut); }
  .quote { border-left:3px solid var(--acc); padding:6px 10px; background:#f5efe6; font-style:italic; margin-bottom:10px; }
  .drawer { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:12px; margin:8px 0 12px; }
  .row { display:flex; gap:8px; align-items:center; }
  .grow { flex:1; }
  .issue-chip { font-size:12px; border:1px solid var(--line); border-radius:6px; padding:1px 7px; background:#fff; }
  .issue-chip.root { border-color:var(--acc); color:var(--acc); }
  .n2 { background:#fbf6ea; border:1px dashed var(--warn); border-radius:8px; padding:10px; margin-top:10px; }
  .n2 h4 { margin:0 0 6px; font-size:13px; }
  .n2 label { display:block; font-size:13px; margin:3px 0; }
  .state { position:fixed; right:0; top:0; bottom:70px; width:270px; background:#111; color:#ddd; font:12px/1.4 ui-monospace, monospace; padding:12px; overflow:auto; }
  .state h5 { margin:0 0 6px; color:#fff; }
  .state .acc { color:#8fd19e; } .state .un { color:#f3c66d; }
  .state .r { color:#f39a7a; }
  .switcher { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#111; color:#fff; border-radius:999px; padding:8px 14px; display:flex; gap:14px; align-items:center; box-shadow:0 6px 24px rgba(0,0,0,.25); font-size:14px; z-index:9; }
  .switcher button { background:transparent; color:#fff; border:none; font-size:18px; padding:0 6px; }
  /* A: ledger */
  .ledger { max-width:820px; }
  .ledger .line { display:grid; grid-template-columns:96px 1fr auto; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); align-items:start; }
  .ledger .who { font-weight:600; font-size:13px; padding-top:3px; }
  .ledger .txt { white-space:pre-wrap; }
  .ledger .acts { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; max-width:260px; }
  .ledger .pad { display:grid; grid-template-columns:1fr; gap:6px; margin-top:12px; }
  .ledger .pad input { font-size:15px; padding:10px; }
  /* B: inbox */
  .inbox { display:grid; grid-template-columns:420px 1fr; gap:20px; }
  .feed .item { padding:10px 12px; border:1px solid var(--line); background:var(--card); border-radius:8px; margin-bottom:8px; cursor:pointer; }
  .feed .item.sel { border-color:var(--acc); box-shadow:0 0 0 2px #f1d9cc; }
  .feed .item.un { border-left:4px solid var(--warn); }
  .feed .add { position:sticky; top:0; background:var(--bg); padding-bottom:8px; }
  .panel { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:14px; min-height:300px; }
  .panel .list label { display:flex; gap:8px; align-items:center; padding:5px 0; border-bottom:1px solid #f0ece4; font-size:14px; }
  /* C: wall */
  .wall { display:flex; gap:12px; overflow-x:auto; padding-bottom:10px; }
  .col { min-width:230px; flex:1; background:#f2eee6; border-radius:10px; padding:10px; }
  .col h3 { margin:0 0 8px; font-size:14px; display:flex; justify-content:space-between; }
  .cardi { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:8px; cursor:grab; font-size:14px; }
  .cardi.un { border-left:4px solid var(--warn); }
  .cardi .foot { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; align-items:center; }
  .tray { margin-top:16px; border-top:2px solid var(--line); padding-top:12px; }
  .tray .issues { display:flex; gap:8px; flex-wrap:wrap; }
  .dropi { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:8px 12px; min-width:180px; }
  .dropi.over { border-color:var(--acc); background:#fbf1eb; }
  .dropi.newi { border-style:dashed; color:var(--mut); }
  .dropi small { display:block; color:var(--mut); }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; z-index:8; }
  .overlay .drawer { width:560px; max-height:85vh; overflow:auto; }
</style>
</head>
<body>
<div id="app"></div>
<div class="state" id="state"></div>
<div class="switcher">
  <button onclick="cycle(-1)">←</button>
  <span id="vlabel"></span>
  <button onclick="cycle(1)">→</button>
</div>
<script>
// ---------- seed (real July 2025 session) ----------
const TAGS = ["Theme","Tone","Character","Arc","Structure","Exposition","Logic","Scene","Dialogue"];
const W = {Theme:9,Tone:8,Character:7,Arc:6,Structure:5,Exposition:4,Logic:3,Scene:2,Dialogue:1};
let givers = ["Akshay","Akhil","Rohan","Prabhav","Hari","Ren"];
let items = [
  {id:1, giver:"Akshay", kind:"R", text:"Liked the film when the angle of death came but not convinced with the love angle", issues:[]},
  {id:2, giver:"Akshay", kind:"R", text:"Why would Benny pay Simon again when he already lost 40 crores", issues:[4]},
  {id:3, giver:"Akhil", kind:"R", text:"Main point only addressed by page 50 — that's 30 min in", issues:[]},
  {id:4, giver:"Akhil", kind:"R", text:"Why would Shaji have a lighter on him if he stopped smoking", issues:[]},
  {id:5, giver:"Akhil", kind:"S", text:"Show the ghosts having real-world consequences — Shaji says where they're going before it happens", issues:[3]},
  {id:6, giver:"Rohan", kind:"S", text:"Just write what happens in the scene, not what the characters feel", issues:[]},
  {id:7, giver:"Rohan", kind:"R", text:"Perspective shifts every 5 mins — everyone is a protagonist", issues:[2]},
  {id:8, giver:"Hari", kind:"R", text:"Cohle's 'did you know this would happen' makes Shaji sound known for it, but the film never shows it", issues:[3]},
  {id:9, giver:"Prabhav", kind:"R", text:"Anton ithenthinte keda", issues:[]},
  {id:10, giver:"Ren", kind:"R", text:"Not enough scenes to sell the mythification of Shaji", issues:[]},
];
let issues = [
  {id:1, title:"Lack of Focused setup", tags:["Structure"], root:true, causedBy:[]},
  {id:2, title:"Perspective and who is this story about", tags:["Structure","Theme"], root:false, causedBy:[1]},
  {id:3, title:"The ghosts problem", tags:["Theme","Character","Logic"], root:true, causedBy:[]},
  {id:4, title:"Gangsters internal logic problem", tags:["Logic"], root:false, causedBy:[]},
];
let nextItem = 11, nextIssue = 5;
const sev = i => i.tags.length ? Math.max(...i.tags.map(t=>W[t])) + (i.tags.length-1) : 0;
const status = i => !i.description ? "Raw" : (i.tags.length && (i.root || i.causedBy.length)) ? "Assessed" : "Captured";

// ---------- shared: extract drawer ----------
// ui state
let ui = { drawerFor:null, // item id or "free"
           draft:{title:"",description:"",tags:[],n2:null,cause:""}, sel:null, linkFor:null };

function drawerHTML(item){
  const d = ui.draft, giver = item ? item.giver : null;
  const ph = giver ? `What in the screenplay makes ${giver} say this?` : "What in the screenplay is the problem?";
  return `<div class="drawer">
    ${item ? `<div class="quote">${item.giver}: “${item.text}”</div>` : `<div class="mut" style="margin-bottom:8px">Issue with no feedback item — your own observation.</div>`}
    <input placeholder="Issue title — the thing in the screenplay (e.g. “Anto has no agency”)" value="${esc(d.title)}" oninput="ui.draft.title=this.value">
    <textarea style="margin-top:8px" placeholder="${ph}" oninput="ui.draft.description=this.value; if(this.value.length>20 && !ui.draft.n2) {ui.draft.n2='ask'; render()}">${esc(d.description)}</textarea>
    <div class="row" style="margin-top:8px; flex-wrap:wrap">${TAGS.map(t=>`<label class="tag"><input type="checkbox" style="width:auto" ${d.tags.includes(t)?"checked":""} onchange="toggleTag('${t}')"> ${t}</label>`).join("")}</div>
    ${d.n2 ? n2HTML() : ""}
    <div class="row" style="margin-top:10px; justify-content:flex-end">
      <button onclick="closeDrawer()">Cancel</button>
      <button class="pri" onclick="saveIssue(${item?item.id:"null"})">Save issue</button>
    </div>
  </div>`;
}
function n2HTML(){
  const d = ui.draft;
  return `<div class="n2"><h4>Could this be a symptom of something deeper?</h4>
    <label><input type="radio" name="n2" style="width:auto" ${d.n2==="cause"?"checked":""} onchange="ui.draft.n2='cause';render()"> Yes — caused by
      <select style="width:auto; display:inline-block; margin-left:6px" onchange="ui.draft.cause=this.value; ui.draft.n2='cause'; render()">
        <option value="">pick…</option>
        ${[...issues].sort((a,b)=> (b.root-a.root) || (sev(b)-sev(a))).map(i=>`<option value="${i.id}" ${d.cause==String(i.id)?"selected":""}>${i.root?"★ ":""}${i.title} (${sev(i)})</option>`).join("")}
        <option value="new" ${d.cause==="new"?"selected":""}>+ new deeper issue…</option>
      </select></label>
    ${d.cause==="new" ? `<input placeholder="Title of the deeper issue (created Raw, linked)" oninput="ui.draft.newCause=this.value" style="margin:4px 0 4px 22px; width:calc(100% - 22px)">` : ""}
    <label><input type="radio" name="n2" style="width:auto" ${d.n2==="root"?"checked":""} onchange="ui.draft.n2='root';render()"> No — this is a root</label>
    <label><input type="radio" name="n2" style="width:auto" ${d.n2==="later"?"checked":""} onchange="ui.draft.n2='later';render()"> Decide later <span class="mut">(counts as a skipped nudge)</span></label>
  </div>`;
}
function toggleTag(t){ const a=ui.draft.tags; a.includes(t)?a.splice(a.indexOf(t),1):a.push(t); render(); }
function openDrawer(itemId){ ui.drawerFor = itemId ?? "free"; ui.draft={title:"",description:"",tags:[],n2:null,cause:"",newCause:""}; render(); }
function closeDrawer(){ ui.drawerFor=null; ui.linkFor=null; render(); }
function saveIssue(itemId){
  const d=ui.draft; if(!d.title) return alert("Title needed");
  let causedBy=[];
  if(d.n2==="cause" && d.cause==="new" && d.newCause){ const n={id:nextIssue++, title:d.newCause, tags:[], root:false, causedBy:[], description:""}; issues.push(n); causedBy=[n.id]; }
  else if(d.n2==="cause" && d.cause) causedBy=[+d.cause];
  const isRoot = d.n2==="root";
  if(isRoot && sev({tags:d.tags})<=3 && d.tags.length){ if(!confirm(`A ${d.tags.join("/")} issue as a root cause? Sure nothing's underneath?\n\nOK = keep as root, Cancel = go back`)) return; }
  const iss={id:nextIssue++, title:d.title, description:d.description, tags:d.tags, root:isRoot, causedBy, skipped:d.n2==="later"};
  issues.push(iss);
  if(itemId) items.find(i=>i.id===itemId).issues.push(iss.id);
  closeDrawer();
}
function link(itemId, issueId){ const it=items.find(i=>i.id===itemId); if(!it.issues.includes(issueId)) it.issues.push(issueId); render(); }
function unlink(itemId, issueId){ const it=items.find(i=>i.id===itemId); it.issues=it.issues.filter(x=>x!==issueId); render(); }
function addItem(giver, kind, text){ if(!text.trim()) return; items.push({id:nextItem++, giver, kind, text:text.trim(), issues:[]}); render(); }
function addGiver(name){ if(name && !givers.includes(name)) givers.push(name); render(); }
const esc = s => (s||"").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const chip = (iss, itemId) => `<span class="issue-chip ${iss.root?"root":""}">${iss.root?"★ ":""}${iss.title}${itemId?` <a href="#" onclick="unlink(${itemId},${iss.id});return false" title="unlink" style="color:#999;text-decoration:none">×</a>`:""}</span>`;
const unaccounted = () => items.filter(i=>!i.issues.length).length;

// ---------- Variant A: ledger ----------
function VariantA(){
  let out = `<div class="ledger"><p class="mut">Type like you take minutes. <b>Enter</b> adds a line. Prefix with a name (<code>Rohan: …</code>) or use the picker. <code>?</code> at the start marks a suggestion.</p>`;
  items.forEach(it=>{
    out += `<div class="line"><div class="who">${it.giver} <span class="pill ${it.kind==="S"?"s":""}">${it.kind==="S"?"suggestion":"reaction"}</span></div>
      <div class="txt">${it.text}${ui.drawerFor===it.id?drawerHTML(it):""}${ui.linkFor===it.id?linkListA(it):""}</div>
      <div class="acts">${it.issues.map(id=>chip(issues.find(i=>i.id===id), it.id)).join("")}
        <button class="sm" onclick="openDrawer(${it.id})">→ issue</button>
        <button class="sm" onclick="ui.linkFor=ui.linkFor===${it.id}?null:${it.id};render()">link</button></div></div>`;
  });
  out += `<div class="pad"><div class="row"><select id="aGiver" style="width:130px">${givers.map(g=>`<option>${g}</option>`).join("")}</select>
    <input id="aText" placeholder="What did they say? (Enter to add)" onkeydown="if(event.key==='Enter'){aAdd()}"></div>
    <div class="row"><button class="sm" onclick="openDrawer(null)">+ issue without feedback</button><button class="sm" onclick="addGiver(prompt('Giver name'))">+ giver</button></div></div>
    ${ui.drawerFor==="free"?drawerHTML(null):""}</div>`;
  return out;
}
function aAdd(){ let t=document.getElementById("aText").value, g=document.getElementById("aGiver").value, kind="R";
  const m=t.match(/^(\w+):\s*(.*)$/); if(m && givers.includes(m[1])){g=m[1]; t=m[2];}
  if(t.startsWith("?")){kind="S"; t=t.slice(1);} addItem(g,kind,t); }
function linkListA(it){ return `<div class="drawer" style="margin-top:6px">${issues.filter(i=>!it.issues.includes(i.id)).map(i=>`<button class="sm" onclick="link(${it.id},${i.id})">${i.root?"★ ":""}${i.title}</button> `).join("")}</div>`; }

// ---------- Variant B: inbox ----------
function VariantB(){
  const sel = items.find(i=>i.id===ui.sel);
  let left = `<div class="feed"><div class="add"><div class="row"><select id="bGiver" style="width:120px">${givers.map(g=>`<option>${g}</option>`).join("")}</select>
    <select id="bKind" style="width:110px"><option value="R">reaction</option><option value="S">suggestion</option></select></div>
    <input style="margin-top:6px" id="bText" placeholder="What did they say? Enter to add — it selects itself so you can extract right away" onkeydown="if(event.key==='Enter'){addItem(bGiver.value,bKind.value,this.value); ui.sel=items[items.length-1].id; render()}"></div>`;
  items.slice().reverse().forEach(it=>{
    left += `<div class="item ${ui.sel===it.id?"sel":""} ${it.issues.length?"":"un"}" onclick="ui.sel=${it.id};ui.drawerFor=null;render()">
      <div class="row"><b>${it.giver}</b> <span class="pill ${it.kind==="S"?"s":""}">${it.kind==="S"?"suggestion":"reaction"}</span>${it.issues.length?"":`<span class="tag" style="margin-left:auto;color:var(--warn)">unaccounted</span>`}</div>
      <div>${it.text}</div><div class="row" style="margin-top:4px;flex-wrap:wrap">${it.issues.map(id=>chip(issues.find(i=>i.id===id))).join("")}</div></div>`;
  });
  left += `</div>`;
  let right = `<div class="panel">`;
  right += `<div class="row" style="margin-bottom:12px"><button class="pri" onclick="openDrawer(${sel?sel.id:"null"})" style="font-size:15px;padding:8px 14px">＋ New issue${sel?` from what ${sel.giver} said`:""}</button>${sel?`<button onclick="openDrawer(null)">＋ Issue without feedback</button>`:""}</div>`;
  if(ui.drawerFor==="free") right += drawerHTML(null);
  if(!sel){ right += `<p class="mut">Or select an item on the left to extract an issue from it / link it to an existing one.</p>`; }
  else {
    right += `<div class="quote">${sel.giver}: “${sel.text}”</div>
      ${ui.drawerFor===sel.id?drawerHTML(sel):""}
      <h3 style="margin:8px 0 4px;font-size:14px">…or link an existing issue</h3>
      <div class="list">${[...issues].sort((a,b)=>sev(b)-sev(a)).map(i=>`<label><input type="checkbox" style="width:auto" ${sel.issues.includes(i.id)?"checked":""} onchange="this.checked?link(${sel.id},${i.id}):unlink(${sel.id},${i.id})"> ${i.root?"★ ":""}${i.title} <span class="tag">${i.tags.join(", ")} · sev ${sev(i)} · ${status(i)}</span></label>`).join("")}</div>`;
  }
  right += `</div>`;
  return `<div class="inbox">${left}${right}</div>`;
}

// ---------- Variant C: wall ----------
function VariantC(){
  let cols = givers.map(g=>{
    const mine = items.filter(i=>i.giver===g);
    return `<div class="col"><h3>${g} <span class="mut">${mine.filter(i=>!i.issues.length).length ? `<span class="badge">${mine.filter(i=>!i.issues.length).length}</span>`:"✓"}</span></h3>
      ${mine.map(it=>`<div class="cardi ${it.issues.length?"":"un"}" draggable="true" ondragstart="event.dataTransfer.setData('t',${it.id})">
        <span class="pill ${it.kind==="S"?"s":""}">${it.kind==="S"?"S":"R"}</span> ${it.text}
        <div class="foot">${it.issues.map(id=>chip(issues.find(i=>i.id===id), it.id)).join("")}<button class="sm" onclick="openDrawer(${it.id})">+</button></div></div>`).join("")}
      <input placeholder="+ ${g} said… (Enter; start with ? for suggestion)" onkeydown="if(event.key==='Enter'){let t=this.value,k='R';if(t.startsWith('?')){k='S';t=t.slice(1)};addItem('${g}',k,t)}"></div>`;
  }).join("");
  let tray = `<div class="tray"><div class="row" style="margin-bottom:8px"><b>Issues</b> <span class="mut">— drag a card onto one to link it</span><button class="sm" style="margin-left:auto" onclick="openDrawer(null)">+ issue without feedback</button><button class="sm" onclick="addGiver(prompt('Giver name'))">+ giver</button></div>
    <div class="issues">${[...issues].sort((a,b)=>sev(b)-sev(a)).map(i=>`<div class="dropi" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="this.classList.remove('over');link(+event.dataTransfer.getData('t'),${i.id})">${i.root?"★ ":""}${i.title}<small>${i.tags.join(", ")||"no tags"} · sev ${sev(i)} · ${items.filter(x=>x.issues.includes(i.id)).length} items</small></div>`).join("")}
    <div class="dropi newi" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="this.classList.remove('over');openDrawer(+event.dataTransfer.getData('t'))">+ drop here to extract a new issue</div></div></div>`;
  const ov = ui.drawerFor!=null ? `<div class="overlay" onclick="if(event.target===this)closeDrawer()">${drawerHTML(ui.drawerFor==="free"?null:items.find(i=>i.id===ui.drawerFor))}</div>` : "";
  return `<div class="wall">${cols}</div>${tray}${ov}`;
}

// ---------- switcher + render ----------
const VARIANTS = {A:["Ledger — type minutes, extract in the margin",VariantA], B:["Inbox — feed left, issue panel right",VariantB], C:["Wall — giver columns, drag cards onto issues",VariantC]};
function cur(){ return new URLSearchParams(location.search).get("variant") || "A"; }
function cycle(d){ const k=Object.keys(VARIANTS), i=(k.indexOf(cur())+d+k.length)%k.length; history.replaceState(null,"",`?variant=${k[i]}`); ui.drawerFor=null; ui.linkFor=null; render(); }
document.addEventListener("keydown", e=>{ if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)) return; if(e.key==="ArrowLeft")cycle(-1); if(e.key==="ArrowRight")cycle(1); });
function render(){
  const v=cur();
  document.getElementById("vlabel").textContent = `${v} — ${VARIANTS[v][0]}`;
  document.getElementById("app").innerHTML = `<header><h1>Session · 25 Jul 2025 · Second draft</h1><span class="meta">${givers.join(", ")}</span>
    <div class="meters"><span>Accounted <b>${items.length-unaccounted()}/${items.length}</b> ${unaccounted()?`<span class="badge">${unaccounted()} unaccounted</span>`:""}</span><span>Issues <b>${issues.length}</b></span></div></header><main>${VARIANTS[v][1]()}</main>`;
  document.getElementById("state").innerHTML = `<h5>STATE</h5><div>items: ${items.length} · <span class="acc">accounted ${items.length-unaccounted()}</span> · <span class="un">unaccounted ${unaccounted()}</span></div><br><h5>ISSUES</h5>` +
    [...issues].sort((a,b)=>sev(b)-sev(a)).map(i=>`<div>${i.root?'<span class="r">★</span> ':''}${i.title}<br>&nbsp;&nbsp;sev ${sev(i)} · ${status(i)}${i.causedBy.length?` · ← ${i.causedBy.map(c=>issues.find(x=>x.id===c)?.title).join(", ")}`:""}${i.skipped?' · <span class="un">N2 skipped</span>':""}</div>`).join("");
}
render();
</script>
</body>
</html>
